name: Build RivalSMP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: RivalSMP-26.1-to-26.3
          path: target/RivalSMP-*.jar
